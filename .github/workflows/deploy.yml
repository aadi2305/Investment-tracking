name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAboOtdXwLI4BPsYvHnvV06Leq4beF0j4g
          VITE_FIREBASE_AUTH_DOMAIN: gen-lang-client-0124024451.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: gen-lang-client-0124024451
          VITE_FIREBASE_STORAGE_BUCKET: gen-lang-client-0124024451.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "824591659352"
          VITE_FIREBASE_APP_ID: "1:824591659352:web:8999fd35650b9278c2f52d"
          VITE_FIREBASE_DATABASE_ID: ai-studio-8aa9cbb4-c6bc-4271-bae4-fe682de7fdb4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
